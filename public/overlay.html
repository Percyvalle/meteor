<title>Метеоритный дождь — overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  html, body { margin: 0; background: #05070f; color: #eaf0ff; font-family: Rubik, "Segoe UI", Arial, sans-serif; color-scheme: dark; }
  .stage { width: 100vw; height: 100vh; overflow: hidden; background: #050a18; }
  .stage canvas { width: 100%; height: 100%; display: block; object-fit: contain; }
  /* OBS: transparent page, canvas fills the source exactly */
  html.obs, html.obs body { background: transparent; }
  html.obs .stage { background: transparent; }
</style>

<div class="stage"><canvas id="stage" aria-label="Игра «Метеоритный дождь»"></canvas></div>
<script type="module" src="./js/app.js"></script>
