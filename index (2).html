<title>Метеоритный дождь</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: the 16:9 stage is the page; a slim console of stream controls sits under it. */
:root {
  --bg: #05070f; --panel: #0c1222; --line: #1c2540; --ink: #eaf0ff; --muted: #8d97b8;
  --fire: #ff7a2f; --fire-ink: #1a0b02;
  --f-disp: "Russo One", "Arial Black", sans-serif;
  --f-ui: Rubik, "Segoe UI", Arial, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-ui); font-size: 15px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 32px; }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 14px; }
.stage { width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #050a18; }
.stage canvas { width: 100%; height: 100%; display: block; }
.console { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.console label { color: var(--muted); font-size: 13px; }
button, select, input { font: inherit; color: var(--ink); background: #131b33; border: 1px solid var(--line); border-radius: 9px; padding: 8px 13px; }
button { cursor: pointer; font-weight: 500; }
button:hover { border-color: #33416b; }
button.primary { background: var(--fire); color: var(--fire-ink); border-color: var(--fire); font-weight: 600; }
button.primary:hover { filter: brightness(1.08); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--fire); outline-offset: 2px; }
input { width: 170px; min-width: 0; }
.spacer { flex: 1; }
.notes { color: var(--muted); font-size: 13.5px; line-height: 1.6; max-width: 80ch; }
.notes code { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink); background: #111830; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
html.obs body { padding: 0; background: transparent; }
html.obs .wrap { max-width: none; gap: 0; }
html.obs .stage { border: 0; border-radius: 0; height: 100vh; width: auto; aspect-ratio: auto; }
html.obs .console, html.obs .notes { display: none; }
@media (max-width: 560px) { .spacer { display: none; } input { width: 100%; } #join-form { width: 100%; } }
[data-tip] { position: relative; }
[data-tip]:hover::after, [data-tip]:focus-visible::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); white-space: nowrap; font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--ink); background: #1a2340; border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; pointer-events: none; z-index: 5; }
</style>

<div class="wrap">
  <div class="stage"><canvas id="stage" aria-label="Игра «Метеоритный дождь»"></canvas></div>
  <div class="console">
    <div class="group">
      <label for="bots">Ботов</label>
      <select id="bots">
        <option value="50">50</option><option value="150">150</option>
        <option value="300" selected>300</option><option value="500">500</option>
      </select>
      <label for="winners">Победителей</label>
      <select id="winners" title="Сколько игроков победит. В чате: !meteor winners 3 (стример или модератор)">
        <option value="1">1</option><option value="2">2</option><option value="3">3</option>
        <option value="5">5</option><option value="10">10</option>
      </select>
      <button id="btn-lobby" class="primary" type="button" data-tip="!meteor start">Новая игра</button>
      <button id="btn-start" type="button" data-tip="!meteor go">Старт сейчас</button>
    </div>
    <div class="spacer"></div>
    <form id="join-form" class="group">
      <input id="nick" type="text" placeholder="Твой ник" maxlength="25" autocomplete="off" aria-label="Ник">
      <select id="island" aria-label="Остров" title="!join 1, !join 2, !join 3 или просто !join">
        <option value="0">Авто</option><option value="1">1 · Тихая гавань</option>
        <option value="2">2 · Вулкан</option><option value="3">3 · Ледник</option>
      </select>
      <button type="submit" data-tip="!join 1 · !join 2 · !join 3">!join</button>
      <button id="btn-me" type="button" data-tip="подсветить себя">!me</button>
    </form>
  </div>
</div>

<script>
/*CORE_START*/
const W = 1920, H = 1080, CELL = 14, GW = Math.ceil(W / CELL), GH = Math.ceil(H / CELL);
const TAU = Math.PI * 2;
const QT = 44, QMIN = 32, QMAX = 60;
const DANGER = { 1: { r: 0.82, warn: 1.2, hails: [] }, 2: { r: 1, warn: 1, hails: [] }, 3: { r: 1.22, warn: 0.82, hails: [9, 21] } };   // qualifier pacing (game seconds)

const PROFILES = {
  calm:    { key: 'calm',    name: 'Тихая гавань', shape: u => u * u,                    base: 2.4, r: [34, 46], warn: [1.8, 1.05], hail: [],      giant: [34], slip: 7,   glacier: false, shard: false },
  volcano: { key: 'volcano', name: 'Вулкан',       shape: u => 1 - Math.pow(1 - u, 2.6), base: 2.6, r: [50, 72], warn: [1.35, 1.0], hail: [5, 15], giant: [],   slip: 7,   glacier: false, shard: true },
  glacier: { key: 'glacier', name: 'Ледник',       shape: u => u,                        base: 1.4, r: [40, 54], warn: [1.6, 1.2],  hail: [],      giant: [],   slip: 1.6, glacier: true,  shard: false },
  final:   { key: 'final',   name: 'Финал',        shape: u => u,                        base: 0,   r: [52, 60], warn: [1.25, 0.8], hail: [],      giant: [],   slip: 7,   glacier: false, shard: false },
};
const LAYOUT = [
  { cx: 350, cy: 595, rx: 262, ry: 212, prof: 'calm' },
  { cx: 960, cy: 595, rx: 262, ry: 212, prof: 'volcano' },
  { cx: 1570, cy: 595, rx: 262, ry: 212, prof: 'glacier' },
];
const FINAL = { cx: 960, cy: 610, rx: 430, ry: 280, prof: 'final' };

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

class Game {
  constructor(seed, winners) {
    this.seed = seed >>> 0;
    this.rng = mulberry32(this.seed);
    this.winnersN = clamp(winners | 0 || 1, 1, 20);
    this.quota = Math.max(2, Math.ceil((this.winnersN + 4) / 3));
    this.phase = 'idle';            // idle | lobby | countdown | qual | transfer | final | won
    this.t = 0; this.gt = 0; this.playT = 0; this.cd = 0; this.tt = 0;
    this.players = []; this.byKey = new Map();
    this.meteors = []; this.events = []; this.mid = 0;
    this.alive = 0; this.startCount = 0; this.F = 0;
    this.timeScale = 1; this.winners = [];
    this.grid = new Map();
    const n = GW * GH;
    this.state = new Uint8Array(n);     // 0 water, 1 land, 2 sinking, 3 rising
    this.owner = new Int8Array(n).fill(-1);
    this.key = new Float32Array(n);
    this.shade = new Float32Array(n);
    this.sinkT = new Float32Array(n);
    for (let i = 0; i < n; i++) this.shade[i] = this.rng();
    this.islands = LAYOUT.map((L, i) => this.buildIsland(i, L, false));
    this.rollDanger();
  }

  computeQuotas() {
    const q0 = Math.max(2, Math.ceil((this.winnersN + 4) / 3));
    this.quota = q0;
    for (const isl of this.islands) if (isl.id < 3) isl.quota = isl.danger === 1 ? Math.round(q0 * 1.5) : isl.danger === 2 ? q0 : Math.max(1, Math.round(q0 * 0.5));
  }

  quotaSum() { return this.islands.reduce((s, i) => s + (i.id < 3 ? i.quota : 0), 0); }

  rollDanger() {
    for (let k = 0; k < 50; k++) {
      for (const isl of this.islands) if (isl.id < 3) isl.danger = 1 + Math.floor(this.rng() * 3);
      this.computeQuotas();
      const lv = new Set(this.islands.filter(i => i.id < 3).map(i => i.danger));
      if (lv.size >= 2 && this.quotaSum() >= this.winnersN + 2) break;
    }
    for (const isl of this.islands) if (isl.id < 3) isl.hails = isl.prof.hail.concat(DANGER[isl.danger].hails).sort((a, b) => a - b);
  }

  setWinners(n) {
    if (this.phase !== 'idle' && this.phase !== 'lobby') return;
    this.winnersN = clamp(n | 0, 1, 20);
    this.computeQuotas();
    if (this.quotaSum() < this.winnersN + 2) this.rollDanger();
  }

  buildIsland(id, L, rising) {
    const r = this.rng;
    const amps = [0, 0, 0.08, 0.06, 0.045, 0.03, 0.02, 0.014];
    const ph = amps.map(() => r() * TAU), ph2 = r() * TAU, ph3 = r() * TAU;
    const isl = {
      id, prof: PROFILES[L.prof], cx0: L.cx, cy0: L.cy, rx: L.rx, ry: L.ry, cx: L.cx, cy: L.cy,
      cells: [], n: 0, n0: 0, alive: 0, done: false, sinkS: 1.03, spawnAcc: 0,
      hails: PROFILES[L.prof].hail.slice(), giants: PROFILES[L.prof].giant.slice(),
    };
    const x0 = Math.max(0, Math.floor((L.cx - L.rx * 1.3) / CELL)), x1 = Math.min(GW - 1, Math.ceil((L.cx + L.rx * 1.3) / CELL));
    const y0 = Math.max(0, Math.floor((L.cy - L.ry * 1.3) / CELL)), y1 = Math.min(GH - 1, Math.ceil((L.cy + L.ry * 1.3) / CELL));
    for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) {
      const i = gy * GW + gx, cx = gx * CELL + CELL / 2, cy = gy * CELL + CELL / 2;
      const dx = (cx - L.cx) / L.rx, dy = (cy - L.cy) / L.ry, d = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
      let e = 1;
      for (let k = 2; k < amps.length; k++) e += amps[k] * Math.sin(k * a + ph[k]);
      const ratio = d / e;
      if (ratio < 1 && cy > 150 && this.state[i] === 0) {
        this.owner[i] = id;
        this.key[i] = ratio + 0.07 * Math.sin(a * 4 + ph2) + 0.05 * Math.sin(a * 9 + ph3) + (r() - 0.5) * 0.05;
        if (rising) { this.state[i] = 3; this.sinkT[i] = -ratio * 1.3 - r() * 0.15; }
        else this.state[i] = 1;
        isl.cells.push(i);
      }
    }
    this.centroid(isl);
    return isl;
  }

  centroid(isl) {
    let sx = 0, sy = 0, c = 0;
    for (const i of isl.cells) if (this.state[i] === 1) { sx += i % GW; sy += (i / GW) | 0; c++; }
    if (c) { isl.cx = (sx / c) * CELL + CELL / 2; isl.cy = (sy / c) * CELL + CELL / 2; }
  }

  cellAt(x, y) {
    const gx = Math.floor(x / CELL), gy = Math.floor(y / CELL);
    if (gx < 0 || gy < 0 || gx >= GW || gy >= GH) return -1;
    return gy * GW + gx;
  }
  isLand(x, y) { const i = this.cellAt(x, y); return i >= 0 && (this.state[i] === 1 || this.state[i] === 2); }
  isSafe(x, y) { const i = this.cellAt(x, y); return i >= 0 && this.state[i] === 1; }

  randomPoint(isl, nx, ny, rad) {
    const r = this.rng;
    if (nx !== undefined) for (let k = 0; k < 10; k++) {
      const x = nx + (r() - 0.5) * 2 * rad, y = ny + (r() - 0.5) * 2 * rad;
      if (this.isSafe(x, y)) return { x, y };
    }
    for (let k = 0; k < 30; k++) {
      const i = isl.cells[Math.floor(r() * isl.cells.length)];
      if (i !== undefined && this.state[i] === 1) return { x: (i % GW) * CELL + CELL / 2, y: ((i / GW) | 0) * CELL + CELL / 2 };
    }
    return { x: isl.cx, y: isl.cy };
  }

  openLobby() { if (this.phase === 'idle') this.phase = 'lobby'; }

  leastIsland() {
    let best = 0;
    for (let i = 1; i < this.islands.length; i++) {
      const a = this.islands[i].n, b = this.islands[best].n;
      if (a < b || (a === b && this.rng() < 0.5)) best = i;
    }
    return best;
  }

  placeOn(p, isl) {
    const pt = this.randomPoint(isl);
    p.x = pt.x + (this.rng() - 0.5) * CELL; p.y = pt.y + (this.rng() - 0.5) * CELL;
    if (!this.isSafe(p.x, p.y)) { p.x = pt.x; p.y = pt.y; }
    p.vx = p.vy = 0; p.wx = p.x; p.wy = p.y;
  }

  // choice: 1..3, or 0/undefined for automatic (least populated island)
  addPlayer(name, choice) {
    name = String(name || '').trim().slice(0, 25);
    const k = name.toLowerCase();
    if (this.phase !== 'lobby' || !name) return null;
    const c = parseInt(choice, 10);
    const old = this.byKey.get(k);
    const target = c >= 1 && c <= this.islands.length ? c - 1 : (old ? old.island : this.leastIsland());
    if (old) {
      if (old.island === target) return old;
      this.islands[old.island].n--; this.islands[old.island].alive--;
      old.island = target; this.islands[target].n++; this.islands[target].alive++;
      this.placeOn(old, this.islands[target]);
      this.events.push({ type: 'move', p: old });
      return old;
    }
    const r = mulberry32(this.seed ^ hashStr(k));
    const p = {
      id: this.players.length, name, island: target, x: 0, y: 0, vx: 0, vy: 0, hue: hashStr(k + '#') % 360,
      speed: 72 + r() * 48, react: 0.12 + r() * 0.5, attn: 0.5 + r() * 0.45,
      alive: true, wx: 0, wy: 0, wt: r() * 2, waterT: 0, joinT: this.t, place: 0, phase: r() * TAU, hl: 0, fly: null,
    };
    this.placeOn(p, this.islands[target]);
    this.players.push(p); this.byKey.set(k, p);
    this.islands[target].n++; this.islands[target].alive++;
    this.alive++;
    this.events.push({ type: 'join', p });
    return p;
  }

  findPlayer(name) { return this.byKey.get(String(name || '').trim().toLowerCase()) || null; }

  start() {
    if (this.phase !== 'lobby' || this.alive < 2) return false;
    if (this.winnersN >= this.alive) this.winnersN = this.alive - 1;
    this.phase = 'countdown'; this.cd = 3; this.startCount = this.alive;
    for (const isl of this.islands) { isl.n0 = isl.n; isl.alive = isl.n; if (isl.n0 === 0) isl.done = true; }
    this.events.push({ type: 'countdown' });
    return true;
  }

  update(dt) {
    this.t += dt;
    const ph = this.phase;
    if (ph === 'idle' || ph === 'lobby') { this.updatePlayers(dt * 0.6, false); return; }
    if (ph === 'countdown') {
      this.cd -= dt; this.updatePlayers(dt, false);
      if (this.cd <= 0) { this.phase = 'qual'; this.gt = 0; this.playT = 0; this.events.push({ type: 'go' }); }
      return;
    }
    if (ph === 'won') { this.updateSink(dt); this.updatePlayers(dt * 0.5, false); return; }
    this.playT += dt;
    if (ph === 'qual') {
      this.gt += dt;
      for (const isl of this.islands) this.directorQual(isl, dt);
      this.updateMeteors(); this.updateSink(dt); this.updatePlayers(dt, true);
      if (this.phase === 'qual') this.checkIslands();
    } else if (ph === 'transfer') {
      this.gt += dt; this.tt += dt;
      if (this.tt >= 1.8 && !this.fin) {
        this.fin = this.buildIsland(3, FINAL, true);
        this.islands.push(this.fin);
        this.events.push({ type: 'ground' });
      }
      this.updateSink(dt); this.updatePlayers(dt, false);
      if (this.tt >= 4.4) {
        for (const p of this.players) if (p.alive) { p.fly = null; p.lift = 0; p.island = 3; }
        this.phase = 'final'; this.F = this.alive; this.finalT0 = this.gt; this.finalReal0 = this.playT; this.finalNext = this.gt + 0.9;
        this.fin.alive = this.alive; this.fin.n0 = this.alive;
        this.events.push({ type: 'final' });
      }
    } else if (ph === 'final') {
      const near = this.alive - this.winnersN <= 2;
      this.timeScale += ((near ? 0.6 : 1) - this.timeScale) * Math.min(1, dt * 3);
      const g = dt * this.timeScale;
      this.gt += g;
      this.directorFinal(g); this.updateMeteors(); this.updateSink(g); this.updatePlayers(g, true);
    }
  }

  notices(m, p) {
    if (m.kind === 'giant') return true;
    let h = Math.imul(m.id + 1, 2654435761) ^ Math.imul(p.id + 7, 40503);
    h = Math.imul(h ^ (h >>> 15), 2246822507); h ^= h >>> 13;
    return ((h >>> 0) / 4294967296) < p.attn;
  }

  updatePlayers(dt, lethal) {
    const B = 24, grid = this.grid; grid.clear();
    const list = [];
    for (const p of this.players) if (p.alive) {
      if (p.fly) { this.updateFly(p, dt); continue; }
      list.push(p);
      const k = ((p.x / B) | 0) + ((p.y / B) | 0) * 100;
      let a = grid.get(k); if (!a) grid.set(k, a = []); a.push(p);
    }
    const r = this.rng, gt = this.gt;
    for (const p of list) {
      const isl = this.islands[p.island];
      if (!isl) continue;
      let fx = 0, fy = 0, fleeing = false;
      if (lethal) for (const m of this.meteors) {
        const age = gt - m.t0;
        if (age < p.react || !this.notices(m, p)) continue;
        const dx = p.x - m.x, dy = p.y - m.y, d = Math.hypot(dx, dy) || 0.01, R = m.r + 26;
        if (d < R) { const w = (R - d) / R + 0.4; fx += dx / d * w; fy += dy / d * w; fleeing = true; }
      }
      let dvx, dvy;
      if (fleeing) { const n = Math.hypot(fx, fy) || 1; dvx = fx / n * p.speed * 1.4; dvy = fy / n * p.speed * 1.4; }
      else {
        p.wt -= dt;
        let dx = p.wx - p.x, dy = p.wy - p.y, d = Math.hypot(dx, dy);
        if (d < 8 || p.wt <= 0) {
          const pt = this.randomPoint(isl, p.x, p.y, 150);
          p.wx = pt.x; p.wy = pt.y; p.wt = 2 + r() * 3;
          dx = p.wx - p.x; dy = p.wy - p.y; d = Math.hypot(dx, dy);
        }
        d = d || 1;
        dvx = dx / d * p.speed * 0.42; dvy = dy / d * p.speed * 0.42;
      }
      const ax = p.x + p.vx * 0.35, ay = p.y + p.vy * 0.35;
      if (!this.isSafe(ax, ay) || !this.isSafe(p.x, p.y)) {
        const cx = isl.cx - p.x, cy = isl.cy - p.y, n = Math.hypot(cx, cy) || 1;
        dvx = dvx * 0.3 + cx / n * p.speed; dvy = dvy * 0.3 + cy / n * p.speed;
        if (!fleeing) { p.wx = isl.cx; p.wy = isl.cy; }
      }
      let sx = 0, sy = 0;
      const gx = (p.x / B) | 0, gy = (p.y / B) | 0;
      for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
        const a = grid.get(gx + ox + (gy + oy) * 100); if (!a) continue;
        for (const q of a) {
          if (q === p) continue;
          const dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy;
          if (d2 < 225 && d2 > 0.0001) { const d = Math.sqrt(d2), w = (15 - d) / 15; sx += dx / d * w; sy += dy / d * w; }
        }
      }
      const k = Math.min(1, dt * isl.prof.slip);
      p.vx += (dvx - p.vx) * k; p.vy += (dvy - p.vy) * k;
      p.x += (p.vx + sx * 70) * dt; p.y += (p.vy + sy * 70) * dt;
      if (lethal) {
        if (!this.isLand(p.x, p.y)) { p.waterT += dt; if (p.waterT > 0.4) this.kill(p, 'drown', -1); }
        else p.waterT = 0;
      }
    }
  }

  updateFly(p, dt) {
    const f = p.fly; f.t += dt;
    const u = clamp(f.t / f.dur, 0, 1), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    p.x = f.x0 + (f.x1 - f.x0) * e;
    p.y = f.y0 + (f.y1 - f.y0) * e - Math.sin(u * Math.PI) * 260;
    p.lift = Math.sin(u * Math.PI);
    if (u >= 1 && this.fin && this.isSafe(f.x1, f.y1)) {
      p.fly = null; p.lift = 0; p.island = 3; p.vx = p.vy = 0; p.wx = p.x; p.wy = p.y;
      this.events.push({ type: 'land', p });
    }
  }

  kill(p, cause, group) {
    if (!p.alive || this.alive <= this.winnersN) return false;
    p.alive = false; p.place = this.alive; this.alive--;
    const isl = this.islands[p.island]; if (isl) isl.alive--;

    else if (e.type === 'islandDone') R.banners.push({ text: e.count ? 'ОТБОР ПРОЙДЕН' : 'НИКТО НЕ ВЫЖИЛ', island: e.island, t: 0, small: true, gold: !!e.count });

    else if (e.type === 'land') R.rings.push({ x: e.p.x, y: e.p.y, r0: 4, r1: 40, t: 0, max: 0.6, col: '255,211,107', w: 3 });

/* ---------- drawing helpers ---------- */

function drawMeteor(m, now, z) {

  ctx.beginPath(); ctx.arc(m.x, m.y, m.r * prog, 0, TAU); ctx.fill();

  const fall = Math.min(0.55, m.warn * 0.45), fs = age - (m.warn - fall);
  if (fs > 0) {
    const f = Math.pow(clamp(fs / fall, 0, 1), 1.5);
    const dx = 0.52, dy = -0.854, dist = 950 * (1 - f);
    const hx = m.x + dx * dist, hy = m.y + dy * dist;
    const hs = clamp(m.r * 0.26, 7, 34);
    ctx.fillStyle = `rgba(0,0,0,${0.35 * f})`;
    ctx.beginPath(); ctx.ellipse(m.x, m.y, m.r * 0.45 * f, m.r * 0.3 * f, 0, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    const tl = hs * 9;
    const tg = ctx.createLinearGradient(hx, hy, hx + dx * tl, hy + dy * tl);
    tg.addColorStop(0, 'rgba(255,170,80,0.9)'); tg.addColorStop(0.4, 'rgba(255,90,40,0.35)'); tg.addColorStop(1, 'rgba(255,60,30,0)');
    ctx.strokeStyle = tg; ctx.lineCap = 'round'; ctx.lineWidth = hs * 1.5;

    const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, hs * 2.2);
    hg.addColorStop(0, 'rgba(255,255,240,1)'); hg.addColorStop(0.25, 'rgba(255,210,120,0.95)'); hg.addColorStop(0.6, 'rgba(255,110,40,0.45)'); hg.addColorStop(1, 'rgba(255,60,20,0)');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(hx, hy, hs * 2.2, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 2; i++) P({ x: hx + (Math.random() - 0.5) * hs, y: hy + (Math.random() - 0.5) * hs, vx: dx * 120 + (Math.random() - 0.5) * 60, vy: dy * 120 + (Math.random() - 0.5) * 60, life: 0.35 + Math.random() * 0.3, max: 0.65, size: 1.5 + Math.random() * 2, col: '#ffb45a', add: true, drag: 2, g: 0 });
  }
}

/* island labels in world space */

function drawHUD(now, dt) {

    const label = ph === 'final' || ph === 'won' ? 'ФИНАЛ · В ИГРЕ' : ph === 'transfer' ? 'ФИНАЛИСТОВ' : 'ОТБОР · В ИГРЕ';

    ctx.fillStyle = C.panel; rrect(ctx, x, 26, w, 92, 18); ctx.fill();
    ctx.strokeStyle = ph === 'final' ? 'rgba(255,211,107,0.3)' : C.line; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = ph === 'final' ? C.gold : C.muted; ctx.font = `600 13px ${F_UI}`; spaced(ctx, label, W / 2, 50, 3, 'center');

  }

    ctx.globalAlpha = clamp(fr * 1.6, 0, 1); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(4,7,16,0.7)'; ctx.font = `180px ${F_DISP}`; ctx.strokeText(String(n), 0, 0);
    ctx.fillStyle = C.gold; ctx.fillText(String(n), 0, 0); ctx.restore();
  }
  if (ph === 'won' && game.winners.length) drawWinners(now, dt);
}

function drawWinners(now, dt) {
  R.winT += dt;
  const list = game.winners, a = clamp(R.winT / 0.8, 0, 1);
  ctx.fillStyle = `rgba(3,5,12,${0.66 * a})`; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = a;
  const cx = W / 2;
  ctx.globalCompositeOperation = 'lighter';
  const hue = list[0].hue, cy0 = list.length === 1 ? 410 : 300;
  for (let i = 0; i < 18; i++) {
    const ang = now * 0.25 + i * TAU / 18;
    ctx.fillStyle = `hsla(${list.length === 1 ? hue : 45},100%,65%,0.045)`;
    ctx.beginPath(); ctx.moveTo(cx, cy0); ctx.arc(cx, cy0, 560, ang, ang + 0.12); ctx.closePath(); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const grow = 0.6 + 0.4 * clamp(R.winT / 0.6, 0, 1);
  if (list.length === 1) {
    const p = list[0];
    drawPlayer({ ...p, x: cx, y: 410, vx: 0, vy: 1, lift: 0 }, now, 7 * grow);
    ctx.fillStyle = C.gold; ctx.font = `600 22px ${F_UI}`; spaced(ctx, 'ПОБЕДИТЕЛЬ', cx, 560, 8, 'center');
    fitFont(p.name, 84, 1100, F_DISP);
    ctx.fillStyle = C.ink; ctx.fillText(p.name, cx, 650);
    ctx.fillStyle = C.muted; ctx.font = `500 26px ${F_UI}`;
    ctx.fillText(`выжил среди ${game.startCount} участников`, cx, 700);
  } else {
    ctx.fillStyle = C.gold; ctx.font = `600 22px ${F_UI}`; spaced(ctx, 'ПОБЕДИТЕЛИ', cx, 170, 8, 'center');
    ctx.fillStyle = C.muted; ctx.font = `500 22px ${F_UI}`;
    ctx.fillText(`${list.length} выживших из ${game.startCount}`, cx, 205);
    const perRow = list.length <= 5 ? list.length : Math.ceil(list.length / 2);
    const rows = Math.ceil(list.length / perRow), cw = 300, chh = 250, gap = 22;
    const top = rows === 1 ? 330 : 260;
    list.forEach((p, i) => {
      const r = Math.floor(i / perRow), inRow = Math.min(perRow, list.length - r * perRow), c = i % perRow;
      const rowW = inRow * cw + (inRow - 1) * gap;
      const x = cx - rowW / 2 + c * (cw + gap), y = top + r * (chh + gap);
      const d = clamp((R.winT - i * 0.08) / 0.4, 0, 1);
      ctx.save(); ctx.globalAlpha = a * d; ctx.translate(0, (1 - d) * 30);
      ctx.fillStyle = 'rgba(12,18,36,0.85)'; rrect(ctx, x, y, cw, chh, 18); ctx.fill();
      ctx.strokeStyle = 'rgba(255,211,107,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
      drawPlayer({ ...p, x: x + cw / 2, y: y + 95, vx: 0, vy: 1, lift: 0 }, now, 3.6);
      ctx.textAlign = 'center';
      fitFont(p.name, 30, cw - 30, F_DISP); ctx.fillStyle = C.ink; ctx.fillText(p.name, x + cw / 2, y + 190);
      ctx.fillStyle = C.gold; ctx.font = `600 14px ${F_UI}`; spaced(ctx, 'ПОБЕДИТЕЛЬ', x + cw / 2, y + 222, 3, 'center');
      ctx.restore();
    });
  }
  ctx.textAlign = 'center'; ctx.fillStyle = C.dim; ctx.font = `500 16px ${F_MONO}`;
  ctx.fillText(`сид ${game.seed.toString(16).toUpperCase().padStart(8, '0')}  ·  ${fmtTime(game.playT)}`, cx, list.length === 1 ? 740 : H - 70);
  ctx.restore();
}

/* ---------- frame ---------- */
let last = performance.now(), lobbyLeft = 0, lobbyDur = LOBBY, fakeQueue = [], fakeAcc = 0, fakeRate = 0, swapAcc = 0;
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs;
  const now = nowMs / 1000;
  if (game.phase === 'lobby') {
    lobbyLeft -= dt;
    if (fakeQueue.length) {
      fakeAcc += fakeRate * dt;
      while (fakeAcc >= 1 && fakeQueue.length) { fakeAcc--; const b = fakeQueue.shift(); addBot(b.name, b.choice); }
    }
    if (botsActive && game.alive > 30) {
      swapAcc += dt * 1.6;
      while (swapAcc >= 1) { swapAcc--; const bots = game.players; const p = bots[Math.floor(Math.random() * bots.length)]; if (p && p.bot) game.addPlayer(p.name, game.leastIsland() + 1); }
    }
    if (lobbyLeft <= 0) { if (!game.start()) { lobbyLeft = 10; lobbyDur = 10; } }
  }
  game.update(dt);
  handleEvents();
  ambient();
  R.groundTimer -= dt;
  if (R.groundDirty && R.groundTimer <= 0) { renderGround(); R.groundDirty = false; R.groundTimer = game.phase === 'transfer' ? 0.08 : 0.2; }

  // camera
  const cam = R.cam; let tx = W / 2, ty = H / 2, tz = 1;
  if (game.phase === 'final') {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const p of game.players) if (p.alive) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
    tx = (x0 + x1) / 2 - 60; ty = (y0 + y1) / 2 - 30;
    tz = clamp(Math.min(W / (x1 - x0 + 800), H / (y1 - y0 + 560)), 1, 1.9);
  } else if (game.phase === 'transfer') { tx = FINAL.cx - 40; ty = FINAL.cy - 40; tz = 1.08; }
  else if (game.phase === 'won' && game.winners.length === 1) { tx = game.winners[0].x; ty = game.winners[0].y; tz = 1.5; }
  const k = Math.min(1, dt * 2.2);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k; cam.z += (tz - cam.z) * k;
  const hw = W / 2 / cam.z, hh = H / 2 / cam.z;
  cam.x = clamp(cam.x, hw, W - hw); cam.y = clamp(cam.y, hh, H - hh);
  R.shake *= Math.pow(0.02, dt);
  const sx = (Math.random() - 0.5) * R.shake, sy = (Math.random() - 0.5) * R.shake;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  ctx.setTransform(cam.z, 0, 0, cam.z, W / 2 - cam.x * cam.z + sx, H / 2 - cam.y * cam.z + sy);
  ctx.globalAlpha = 0.45 + 0.15 * Math.sin(now * 1.4);
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(shore, -12, -12, W + 24, H + 24);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(ground, 0, 0);
  // sinking / rising cells
  for (const isl of game.islands) for (const i of isl.cells) {
    const s = game.state[i]; if (s !== 2 && s !== 3) continue;
    const x = (i % GW) * CELL + 7, y = ((i / GW) | 0) * CELL + 7;
    if (s === 2) {
      const t = clamp(game.sinkT[i] / 0.9, 0, 1);
      if (t <= 0) continue;
      ctx.fillStyle = `rgba(6,18,40,${t})`; ctx.beginPath(); ctx.arc(x, y, CELL * 0.8, 0, TAU); ctx.fill();
      if (Math.sin(now * 30 + i) > 0.3) { ctx.fillStyle = `rgba(120,220,255,${0.35 * (1 - t)})`; ctx.fillRect(x - 5, y - 1, 10, 2); }
    } else {
      const t = clamp(1 + game.sinkT[i] / 0.4, 0, 1);
      if (t <= 0) continue;
      ctx.fillStyle = `rgba(255,211,107,${0.35 * t})`; ctx.beginPath(); ctx.arc(x, y, CELL * 0.75 * t, 0, TAU); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const gl of R.glows) {
    gl.t += dt; const a = clamp(1 - gl.t / 3.5, 0, 1); if (a <= 0) continue;
    const rg = ctx.createRadialGradient(gl.x, gl.y, 0, gl.x, gl.y, gl.r * 0.9);
    rg.addColorStop(0, `rgba(255,120,40,${0.45 * a})`); rg.addColorStop(0.6, `rgba(255,70,20,${0.18 * a})`); rg.addColorStop(1, 'rgba(255,40,10,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(gl.x, gl.y, gl.r * 0.9, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  R.glows = R.glows.filter(g => g.t < 3.5);
  for (const m of game.meteors) if (game.gt - m.t0 < m.warn - 0.55) drawMeteor(m, now, cam.z);
  // players
  const alive = game.players.filter(p => p.alive);
  const showAll = game.phase === 'final' || game.phase === 'transfer';
  const named = [];
  const fewOn = new Set(game.islands.filter(i => i.alive <= 12).map(i => i.id));
  for (const p of alive) {
    if (p.dropT > 0) {
      p.dropT -= dt;
      const f = clamp(p.dropT / 0.7, 0, 1);
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `hsla(${p.hue},100%,70%,${0.7 * f})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(p.x, p.y - f * 420); ctx.lineTo(p.x, p.y - f * 420 - 60); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      if (p.dropT <= 0) R.rings.push({ x: p.x, y: p.y, r0: 4, r1: 26, t: 0, max: 0.5, col: '200,230,255', w: 2 });
      if (f > 0.02) continue;
    }
    if (game.phase === 'won' && R.winT > 0.3) continue;
    if (p.lift > 0.05) {
      P({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 20, vy: 10, life: 0.5, max: 0.5, size: 3, col: `hsl(${p.hue} 100% 70%)`, add: true, drag: 1, g: 0 });
      drawPlayer(p, now, 1 + p.lift * 0.5);
    } else drawPlayer(p, now, 1);
    let inDanger = false;
    if (game.phase === 'qual' && !fewOn.has(p.island)) for (const m of game.meteors) { if (game.gt >= m.t0 && Math.hypot(p.x - m.x, p.y - m.y) < m.r) { inDanger = true; break; } }
    const recent = game.phase === 'lobby' && game.t - p.joinT < 2.5;
    if (p.hl > 0) p.hl -= dt;
    if (showAll || (game.phase === 'qual' && fewOn.has(p.island)) || inDanger || recent || p.hl > 0) named.push(p);
  }
  for (const m of game.meteors) if (game.gt - m.t0 >= m.warn - 0.55) drawMeteor(m, now, cam.z);
  for (const r of R.rings) {
    r.t += dt; const f = clamp(r.t / r.max, 0, 1);
    ctx.strokeStyle = `rgba(${r.col},${0.8 * (1 - f)})`; ctx.lineWidth = r.w * (1 - f) + 0.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * (1 - Math.pow(1 - f, 3)), 0, TAU); ctx.stroke();
  }
  R.rings = R.rings.filter(r => r.t < r.max);
  drawParticles(dt, false);
  const ns = clamp(13 / Math.sqrt(cam.z) * 1.15, 12, 16);
  for (const p of named) {
    drawName(p, p.hl > 0 ? 20 : ns, p.hl > 0 ? C.gold : undefined);
    if (p.hl > 0) { ctx.strokeStyle = C.gold; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(p.x, p.y, 16 + 4 * Math.sin(now * 8), 0, TAU); ctx.stroke(); }
  }
  drawIslandLabels();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (R.flash > 0) { ctx.fillStyle = `rgba(255,220,180,${R.flash * 0.5})`; ctx.fillRect(0, 0, W, H); R.flash = Math.max(0, R.flash - dt * 2); }
  if (game.phase === 'final') {
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(40,0,0,0.45)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  drawHUD(now, dt);
  drawParticles(dt, true);
  requestAnimationFrame(frame);
}
function drawParticles(dt, screen) {
  const arr = R.particles;
  for (const p of arr) {
    if (!!p.screen !== screen) continue;
    p.life -= dt;
    const dr = Math.exp(-p.drag * dt);
    p.vx *= dr; p.vy = p.vy * dr + p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) continue;
    const a = p.snow ? Math.min(1, p.life / 2) * 0.7 : clamp(p.life / p.max, 0, 1);
    if (p.smoke) {
      ctx.fillStyle = p.col + (0.32 * a) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.6 - a * 0.6), 0, TAU); ctx.fill();
    } else if (p.conf) {
      p.rot += p.vr * dt; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, p.life); ctx.fillStyle = p.col; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); ctx.globalAlpha = 1;
    } else {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a; ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.orb || p.snow ? 1 : a + 0.3), 0, TAU); ctx.fill();
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
  }
  if (screen) R.particles = arr.filter(p => p.life > 0);
}

/* ---------- bots ---------- */
const NA = ['Dark', 'Kot', 'Shadow', 'Neko', 'Ghost', 'Lazy', 'Pixel', 'Toxic', 'Moon', 'Ice', 'Vortex', 'Panda', 'Sanya', 'Lyoha', 'Kirill', 'Vasya', 'Dimon', 'Mr', 'Zloy', 'Tihiy', 'Crazy', 'Sleepy', 'Turbo', 'Mega', 'Night', 'Frost', 'Lucky', 'Old', 'Baby', 'Red', 'Blue', 'Silent', 'Danya', 'Artem', 'Masha', 'Katya', 'Nastya', 'Igor', 'Borsch', 'Pelmen'];
const NB = ['Wolf', 'Cat', 'Gamer', 'Hunter', 'Fox', 'Ninja', 'Bear', 'Pro', 'Slayer', 'Potato', 'Goose', 'Knight', 'Sniper', 'Dragon', 'Owl', 'Rider', 'Boss', 'Kid', 'Lord', 'Shark', 'Pirate', 'Mage', 'Chill', 'Bober', 'Enot'];
function makeBots(n) {
  const out = new Set();
  while (out.size < n) {
    const a = NA[Math.floor(Math.random() * NA.length)], b = NB[Math.floor(Math.random() * NB.length)], r = Math.random();
    out.add(r < 0.3 ? a + b : r < 0.55 ? a + '_' + b : r < 0.75 ? a.toLowerCase() + b + Math.floor(Math.random() * 999) : r < 0.88 ? 'xX' + b + 'Xx' : b.toLowerCase() + '_' + a.toLowerCase() + Math.floor(Math.random() * 99));
  }
  return [...out].map(name => {
    const r = Math.random();
    return { name, choice: r < 0.42 ? 1 : r < 0.65 ? 2 : r < 0.9 ? 3 : 0 };
  });
}

/* ---------- controls ---------- */
let botsActive = false;
function newGame(openLobby) {
  game = new Game((Math.random() * 4294967296) >>> 0, WINNERS);
  resetRender();
  renderGround();
  fakeQueue = []; botsActive = false;
  if (openLobby) startLobby();
}
function startLobby() {
  if (game.phase !== 'idle') newGame(false);
  game.openLobby();
  lobbyDur = LOBBY; lobbyLeft = LOBBY;
  if (!CHANNEL || QS.get('bots')) {
    fakeQueue = makeBots(SIM_COUNT);
    fakeRate = SIM_COUNT / Math.max(1, LOBBY * 0.7);
    fakeAcc = 0; botsActive = true;
  }
}
const _add = Game.prototype.addPlayer;
function addBot(name, choice) { const p = _add.call(game, name, choice); if (p) p.bot = true; return p; }
function forceStart() {
  if (game.phase === 'lobby') { fakeQueue.forEach(b => addBot(b.name, b.choice)); fakeQueue = []; game.start(); }
}
function setWinners(n) {
  WINNERS = clamp(n | 0, 1, 10);
  game.setWinners(WINNERS);
}
function highlight(name) { const p = game.findPlayer(name); if (p && p.alive) p.hl = 2.5; }

const $ = id => document.getElementById(id);
if ($('btn-lobby')) {
  $('winners').value = String(WINNERS);
  $('btn-lobby').onclick = () => { SIM_COUNT = parseInt($('bots').value, 10); WINNERS = parseInt($('winners').value, 10); newGame(true); };
  $('btn-start').onclick = forceStart;
  $('winners').onchange = e => setWinners(parseInt(e.target.value, 10));
  $('join-form').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('nick').value.trim(); if (!v) return;
    if (game.phase === 'lobby') { const p = game.addPlayer(v, parseInt($('island').value, 10)); if (p) p.hl = 3; }
    else highlight(v);
  });
  $('btn-me').onclick = () => { const v = $('nick').value.trim(); if (v) highlight(v); };
}

/* ---------- twitch chat (works when the page runs in OBS or a browser, not inside the claude.ai preview) ---------- */
if (CHANNEL) {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/dist/tmi.min.js';
  s.onload = () => {
    const client = new window.tmi.Client({ channels: [CHANNEL] });
    client.connect().catch(() => {});
    client.on('message', (_ch, tags, msg) => {
      const m = msg.trim().toLowerCase(), name = tags['display-name'] || tags.username;
      const boss = tags.mod || (tags.badges && tags.badges.broadcaster);
      const j = m.match(/^!join\s*([1-3])?$/);
      if (j) { if (game.phase === 'lobby') game.addPlayer(name, j[1] ? +j[1] : 0); return; }
      if (m === '!me') { highlight(name); return; }
      if (!boss) return;
      if (m === '!meteor start') newGame(true);
      else if (m === '!meteor go') forceStart();
      else if (m === '!meteor reset') newGame(false);
      else { const w = m.match(/^!meteor winners\s+(\d+)$/); if (w) setWinners(+w[1]); }
    });
  };
  document.head.appendChild(s);
}

newGame(!CHANNEL);
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

</script>
